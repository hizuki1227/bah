<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bahhh! / Pa!!!!</title>
    <style>
  :root {
    --paper: #efeadf;
    --ink: #1a1a1a;
    --bubble: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 16px;
  }
  .stage {
    position: relative;
    width: min(88vw, 480px);
    aspect-ratio: 1 / 1;
  }
  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  #openImg { visibility: hidden; }
  .stage.is-open #openImg { visibility: visible; }
  .stage.is-open #closeImg { visibility: hidden; }

  .bubble {
    position: absolute;
    top: 2%;
    right: -4%;
    max-width: fit-content;
    padding: 10px 18px;
    background: var(--bubble);
    border: 3px solid var(--ink);
    border-radius: 26px;
    font-size: clamp(22px, 6vw, 34px);
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    opacity: 0;
    transform: scale(.6);
    transform-origin: 10% 100%;
    transition: opacity .08s, transform .12s;
    pointer-events: none;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 14%;
    bottom: -17px;
    width: 22px;
    height: 22px;
    background: var(--bubble);
    border-right: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    transform: rotate(40deg) skew(10deg, 10deg);
  }
  .bubble.show { opacity: 1; transform: scale(1); }

  .buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    font-size: 22px;
    font-weight: 700;
    padding: 14px 28px;
    background: var(--ink);
    color: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .notice {
    margin: 0;
    font-size: 15px;
    opacity: .75;
  }
  button:active { transform: translateY(2px); }
  button:focus-visible { outline: 3px solid #d33; outline-offset: 3px; }
</style>
  </head>
  <body>
    <div class="stage" id="stage">
      <img id="closeImg" src="source/close.jpeg" alt>
      <img id="openImg" src="source/open.jpeg" alt>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>

    <p class="notice">※ ボタンを押すと音声が流れます</p>

    <div class="buttons">
      <button type="button" id="bahBtn">Bahhh!</button>
      <button type="button" id="paBtn">Pa!!!!</button>
      <button type="button" id="killYouBtn">killYou!!!!</button>
      <button type="button" id="iCantBtn">出来るｶｧ!!</button>
      <button type="button" id="yeahBtn">ｲｪｲ!!!!</button>
      <button type="button" id="rateDownBtn">良いﾓﾝ!!!</button>
      <button type="button" id="nnBtn">ン゙ﾝ!!!</button>
      <button type="button" id="faaaBtn">ﾌｧｧｧ!!!</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
